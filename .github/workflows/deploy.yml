name: Deploy static website


on:

  # Deploy once every day at noon in Europe/Warsaw.
  schedule:
    - cron: "0 12 * * *"
      timezone: "Europe/Warsaw"


  # Allow an immediate manual deployment.
  workflow_dispatch:


jobs:

  ship-to-linode:

    runs-on: ubuntu-latest


    steps:

      # ----------------------------------------------------------
      # STEP 1: Checkout the repository
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # ----------------------------------------------------------
      # STEP 2: Build the complete website
      #
      # Creates:
      #
      #   build/index.html
      #   build/css/style.css
      #   build/css/stylez.css
      #   build/entries/*.html
      # ----------------------------------------------------------

      - name: Build website

        run: |
          python3 scripts/build_entries.py


      # ----------------------------------------------------------
      # STEP 3: Configure SSH
      # ----------------------------------------------------------

      - name: Configure SSH

        env:
          SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_KEY }}
          LINODE_HOST: ${{ secrets.LINODE_HOST }}

        run: |

          set -euo pipefail

          mkdir -p ~/.ssh

          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$LINODE_HOST" \
            >> ~/.ssh/known_hosts


      # ----------------------------------------------------------
      # STEP 4: Deploy build/ to Linode
      #
      # --delete means the Linode becomes an exact copy of build/.
      #
      # If you delete an entry from GitHub, it will also disappear
      # from the live site during the next deployment.
      # ----------------------------------------------------------

      - name: Deploy website to Linode

        env:
          LINODE_HOST: ${{ secrets.LINODE_HOST }}
          LINODE_USER: ${{ secrets.LINODE_USER }}

        run: |

          set -euo pipefail

          rsync \
            -az \
            --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            build/ \
            "$LINODE_USER@$LINODE_HOST:/var/www/html/project/terra-in-cognita/"
