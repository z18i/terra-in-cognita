# The name displayed for this workflow in GitHub's "Actions" tab.
name: Deploy static website

# Defines what causes this workflow to run.
on:
  # Run the workflow whenever someone pushes commits...
  push:
    # ...specifically to the "main" branch.
    #
    # So:
    #   git push origin main
    #
    # will trigger the deployment.
    branches:
      - main


# A workflow consists of one or more jobs.
jobs:

  # "deploy" is an arbitrary name we give this job.
  # We could call it "ship-to-linode" if we wanted.
  ship-to-linode:

    # GitHub provides a temporary Ubuntu machine to execute this job.
    #
    # This machine is NOT your Linode.
    # GitHub creates it for the workflow, runs these commands,
    # and eventually throws it away.
    runs-on: ubuntu-latest

    # The individual things this job needs to do.
    steps:

      # A human-readable name for this step.
      - name: Deploy website to Linode

        # Environment variables available to the shell commands below.
        env:

          # Get the private SSH key from the GitHub repository secret
          # called LINODE_SSH_KEY.
          #
          # This is the private key that allows GitHub Actions
          # to SSH INTO your Linode.
          SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_KEY }}

          # The IP address or hostname of your Linode.
          #
          # For example:
          #   123.123.123.123
          #
          # This comes from a GitHub repository secret rather than
          # being written directly into the workflow.
          LINODE_HOST: ${{ secrets.LINODE_HOST }}

          # The Linux user that GitHub Actions will log in as.
          #
          # In your case this is:
          #   giter
          #
          # So this becomes:
          #   ssh giter@YOUR_LINODE_IP
          LINODE_USER: ${{ secrets.LINODE_USER }}


        # Everything underneath "run: |" is a shell script.
        #
        # The script runs on GitHub's temporary Ubuntu machine,
        # NOT on your Linode (until we explicitly SSH into it below).
        run: |

          # Create the .ssh directory for the GitHub Actions runner.
          #
          # "~" means the current user's home directory.
          #
          # "-p" means:
          #   - create the directory if it doesn't exist
          #   - don't complain if it already exists
          mkdir -p ~/.ssh

          # SSH expects ~/.ssh to have restrictive permissions.
          #
          # 700 means:
          #   owner: read + write + execute
          #   everyone else: no access
          chmod 700 ~/.ssh


          # Take the private SSH key stored in the GitHub secret
          # and write it to a file on the temporary GitHub runner.
          #
          # "$SSH_PRIVATE_KEY" contains the key.
          #
          # The resulting file will be:
          #   ~/.ssh/deploy_key
          #
          # Despite the filename "deploy_key", this is NOT a key
          # that lives permanently on GitHub. The runner is temporary.
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key

          # Private SSH keys must not be readable by other users.
          #
          # 600 means:
          #   owner: read + write
          #   everyone else: no access
          chmod 600 ~/.ssh/deploy_key


          # Add your Linode's SSH host key to known_hosts.
          #
          # SSH normally asks:
          #
          #   "Are you sure you want to connect to this server?"
          #
          # GitHub Actions can't answer that interactively, so we
          # add the host key beforehand.
          #
          # "-H" hashes the hostname in the resulting known_hosts file.
          ssh-keyscan -H "$LINODE_HOST" >> ~/.ssh/known_hosts


          # NOW we actually connect to your Linode.
          #
          # -i ~/.ssh/deploy_key
          #     Use the private key we just created.
          #
          # "$LINODE_USER@$LINODE_HOST"
          #     Connect as:
          #
          #       giter@YOUR_LINODE_IP
          #
          # Everything between << 'EOF' and the final EOF is sent
          # to the Linode and executed THERE.
          ssh -i ~/.ssh/deploy_key "$LINODE_USER@$LINODE_HOST" << 'EOF'

            # Move into the directory containing your website.
            #
            # Your actual directory is:
            #   /var/www/html/project/terra-in-cognita/
            cd /var/www/html/project/terra-in-cognita/

            # Download the latest commit from GitHub and update
            # the working directory.
            #
            # "origin" = your GitHub repository
            # "main"   = the branch we're deploying
            git pull origin main

          # This marks the end of the commands that should run
          # on the Linode.
          EOF
