name: Deploy static website


on:

  # Deploy once every day at noon in Europe/Warsaw.
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Europe/Warsaw"


  # Allow an immediate manual deployment.
  workflow_dispatch:


jobs:

  ship-to-linode:

    runs-on: ubuntu-latest


    steps:

      # ----------------------------------------------------------
      # STEP 1: Checkout the repository
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # ----------------------------------------------------------
      # STEP 2: Build the complete website
      #
      # Creates:
      #
      #   build/index.html
      #
      #   build/css/
      #       style.css
      #       stylez.css
      #       linux.css
      #
      #   build/entries/
      #       *.html
      #
      #   build/linux/
      #       index.html
      #       files.html
      #       text.html
      #       finding.html
      #       wildcards.html
      #       permissions.html
      #       processes.html
      #       networking.html
      #       ssh.html
      #       git.html
      #       commands.html
      #
      # The build directory is the complete deployable website.
      # ----------------------------------------------------------

      - name: Build website

        run: |
          python3 scripts/build_entries.py


      # ----------------------------------------------------------
      # STEP 3: Configure SSH
      # ----------------------------------------------------------

      - name: Configure SSH

        env:
          SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_KEY }}
          LINODE_HOST: ${{ secrets.LINODE_HOST }}

        run: |

          set -euo pipefail

          mkdir -p ~/.ssh

          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$LINODE_HOST" \
            >> ~/.ssh/known_hosts


      # ----------------------------------------------------------
      # STEP 4: Deploy build/ to Linode
      #
      # --delete means the Linode becomes an exact copy of build/.
      #
      # Therefore:
      #
      #   deleting an entry     -> deletes it from the website
      #   deleting a Linux page -> deletes it from the website
      #   deleting a stylesheet -> deletes it from the website
      #
      # The Linode contains only the generated website.
      # ----------------------------------------------------------

      - name: Deploy website to Linode

        env:
          LINODE_HOST: ${{ secrets.LINODE_HOST }}
          LINODE_USER: ${{ secrets.LINODE_USER }}

        run: |

          set -euo pipefail

          rsync \
            -az \
            --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            build/ \
            "$LINODE_USER@$LINODE_HOST:/var/www/html/project/terra-in-cognita/"
